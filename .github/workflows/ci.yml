name: DamnCRUD CI - Functional Testing

on:
  push:
  pull_request:

jobs:
  functional-test:
    runs-on: ubuntu-latest

    env:
      # Konfigurasi database untuk environment CI
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: root123
      DB_NAME: damncrud

      # URL aplikasi ketika PHP built-in server berjalan
      BASE_URL: http://127.0.0.1:8000

      # Chrome harus headless di GitHub Actions
      HEADLESS: "1"

      # Mencegah telemetry Selenium Manager
      SE_AVOID_STATS: "true"

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root123

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # Mengambil source code repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # Menyiapkan PHP dan extension PDO MySQL
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql
          tools: none

      # Menyiapkan Python
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Menyiapkan Google Chrome dan ChromeDriver
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      # Install MySQL client agar SQL dump dapat di-import
      - name: Install MySQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      # Import database dari repository
      - name: Import Database
        run: |
          mysql \
            -h 127.0.0.1 \
            -P 3306 \
            -u root \
            -proot123 \
            < db/damncrud.sql

      # Install Selenium, Pytest, dan pytest-xdist
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Menjalankan aplikasi PHP di background
      - name: Start PHP Server
        run: |
          php -S 127.0.0.1:8000 -t . > php-server.log 2>&1 &

      # Memastikan aplikasi sudah dapat diakses
      - name: Wait for Application
        run: |
          curl \
            --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            http://127.0.0.1:8000/login.php

      # Menjalankan 5 test Selenium secara paralel
      - name: Run Selenium Tests in Parallel
        run: |
          pytest tests/test_functional.py -n auto -v